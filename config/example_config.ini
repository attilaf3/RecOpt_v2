[paths]
# Relative paths are resolved from the repository root. Absolute paths are also accepted.
input_root = Input
output_root = results
scenario_for_path = network\99999
simulation = original_0.15_original
simulation_yaml = ${input_root}\${scenario_for_path}\${simulation}\simulation_config_disaggregated_with_userlist.yaml
simulation_yaml_base = ${input_root}\${scenario_for_path}\${simulation}\simulation_config_disaggregated.yaml
profiles_csv = ${input_root}\${scenario_for_path}\${simulation}\measurements_disaggregated.csv
dhw_profiles_csv = ${input_root}\${scenario_for_path}\${simulation}\dhw.csv
dhw_profiles_v2_csv = ${input_root}\${scenario_for_path}\${simulation}\dhw_v2.csv
users_directory = ${input_root}\\${scenario_for_path}\\${simulation}\\Users

# Heat-pump source data
heat_pump_weather_root = ${input_root}\HeatPump
heat_pump_temperature_csv = ${heat_pump_weather_root}\homerseklet_sugarzas_interpolated_polynomial_fixed.csv
heat_pump_solar_csv = ${heat_pump_weather_root}\zsombo_window_irradiance_2021_fixed_interpolated_polynomial.csv
heat_pump_geoprofile_csv = ${heat_pump_weather_root}\geoprofil.csv
heat_pump_aggregate_output_csv = ${output_root}\hp_profile_avg.csv

# Scenario and plotting output directories
noopt_output = ${output_root}\nonoptimized
noopt_household_plot_results = ${output_root}\results_base_with_bess_A_tariff
noopt_community_plot_results = ${output_root}\results_nonopt_community_B_proportional
individual_boiler_output = ${output_root}\results_individual_opt_boiler
scenario_3d_k_output = ${output_root}\3d-K
individual_bess_output = ${output_root}\results_individual_opt_bess
individual_bess_boiler_output = ${output_root}\results_individual_opt_bess_boiler
community_output = ${output_root}\results_disaggregated_opt_bess_shared
scenario_4d_i_output = ${output_root}\4d-I
community_plot_results = ${output_root}\results_disaggregated_hourly
yaml_inventory_output = ${output_root}\yaml_inventory
userlist_output_yaml = ${input_root}\simulation_config_disaggregated_with_userlist.yaml

[tariffs]
# Prices are Ft/kWh; limits are kWh/year.
grid_a_low_limit_kwh = 2523.0
grid_a_low_ft_per_kwh = 36.0
grid_a_high_ft_per_kwh = 71.0
grid_b_low_limit_kwh = 2523.0
grid_b_low_ft_per_kwh = 23.0
grid_b_high_ft_per_kwh = 61.0
grid_hp_low_limit_kwh = 2523.0
grid_hp_low_ft_per_kwh = 29.34
grid_hp_high_ft_per_kwh = 60.1
pv_export_ft_per_kwh = 5.0
shared_buyer_low_limit_kwh = 2523.0
shared_buyer_low_ft_per_kwh = 5.0
shared_buyer_high_ft_per_kwh = 21.0
shared_rhd_ft_per_kwh = 31.0

[simulation]
dt_hours = 0.25
hp_dt_hours = 0.25
default_boiler_tariff = B
default_sharing_mode = proportional
default_max_users = 10

[bess]
allow_grid_charge_for_min_soc = False

[optimization]
solver = auto
preferred_solver = GUROBI
fallback_solver = CBC
allow_fallback = True
accepted_statuses = Optimal,Integer Feasible

[scenario]
default_code = 0-I
max_users = 105
pv_ratio = 1.0
bess_share_pct = 100.0
heat_pump_share_pct = 28.0
sharing_mode = proportional
run_lp = False

[scenario_outputs]
0_i_output = ${paths:output_root}\0-I
0_k_output = ${paths:output_root}\0-K
1d_i_output = ${paths:output_root}\1d-I
1d_k_output = ${paths:output_root}\1d-K
2d_k_output = ${paths:output_root}\2d-K
3d_i_output = ${paths:output_root}\3d-I
3d_k_output = ${paths:output_root}\3d-K
4d_i_output = ${paths:output_root}\4d-I
4d_k_e_output = ${paths:output_root}\4d-K-E
4d_k_c_output = ${paths:output_root}\4d-K-C
5d_i_output = ${paths:output_root}\5d-I
5d_k_output = ${paths:output_root}\5d-K

[visualization]
fontsize = 14
dpi = 200
